name: Simulation quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04 # Supported by pinned Playwright 1.55.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:playtest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify portable offline playtest
        run: npm run test:playtest
      - name: Upload verified playable build
        uses: actions/upload-artifact@v4
        with:
          name: corporate-simulator-playtest
          path: |
            playtest/Corporate Simulator 2026.html
            playtest/screenshots/
            docs/PLAYTEST_GUIDE.md
          if-no-files-found: error
          retention-days: 30
