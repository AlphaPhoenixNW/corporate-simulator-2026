name: Private publication privacy inventory
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/privacy-review.yml'
      - 'scripts/review-publication-privacy.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  privacy:
    if: github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.head_ref == 'security/publication-hardening' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Inventory reachable history and repository surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/review-publication-privacy.py
      - name: Download checksum-verified Gitleaks release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/privacy-scan"
          cd "$RUNNER_TEMP/privacy-scan"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan reachable Git history without disclosing matches
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/privacy-scan"
          trap 'rm -rf "$scan"' EXIT
          status=0
          "$scan/gitleaks" git --log-opts="--all --full-history" --redact=100 --report-format=json --report-path="$scan/report.json" --no-banner . >"$scan/scan.log" 2>&1 || status=$?
          python3 - "$scan/report.json" "$status" <<'PY'
          import json, sys
          from pathlib import Path
          path, status = Path(sys.argv[1]), int(sys.argv[2])
          if status not in (0, 1) or not path.is_file():
              print("Gitleaks scan did not complete; no clearance can be inferred.")
              raise SystemExit(2)
          findings = json.loads(path.read_text())
          print("GITLEAKS_FINDINGS", len(findings))
          if findings:
              print("Private investigation required; no findings are printed or uploaded.")
              raise SystemExit(1)
          if status:
              raise SystemExit(status)
          PY
