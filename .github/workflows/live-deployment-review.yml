name: Live deployment security review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-deployment-review.yml'
      - 'scripts/verify-live-headers.py'
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Explicit Cloudflare Pages deployment root URL
        required: true
        type: string
permissions:
  contents: read
jobs:
  live-headers:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'release/v1.0.0-preparation' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check live deployed HTTP responses
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url || 'https://f80344b8.corporate-simulator-2026.pages.dev/' }}
        run: python3 scripts/verify-live-headers.py "$DEPLOYMENT_URL"
