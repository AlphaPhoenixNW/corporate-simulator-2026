name: Dependency security audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Audit ${{ matrix.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [all, production]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit locked dependency graph
        env:
          AUDIT_SCOPE: ${{ matrix.scope }}
        run: |
          if [ "$AUDIT_SCOPE" = "production" ]; then
            npm audit --omit=dev --audit-level=high
          else
            npm audit --audit-level=high
          fi
