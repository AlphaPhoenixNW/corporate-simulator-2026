name: Temporary EA-001 artifact cleanup
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ea-001-artifact-cleanup.yml'
permissions: {}
jobs:
  cleanup:
    if: github.event.repository.private == true && github.repository == 'AlphaPhoenixNW/corporate-simulator-2026' && github.event.pull_request.number == 28 && github.head_ref == 'security/publication-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remove authorised superseded playtest archives only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = "https://api.github.com/repos/AlphaPhoenixNW/corporate-simulator-2026/"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "ea-001-private-cleanup"}
          cutoff = "2026-11-26T07:42:44Z"
          retained_id = 15096028968
          def list_all():
              out, page = [], 1
              while True:
                  req = urllib.request.Request(base + f"actions/artifacts?per_page=100&page={page}", headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      items = json.load(response)["artifacts"]
                  out.extend(items)
                  if len(items) < 100:
                      return out
                  page += 1
          def eligible(a):
              return (a["name"] == "corporate-simulator-playtest" and not a["expired"]
                      and a["created_at"] < cutoff and a["id"] != retained_id)
          before = list_all()
          if not any(a["id"] == retained_id and not a["expired"] for a in before):
              raise SystemExit("Verified retained artifact not found; cleanup aborted")
          targets = [a for a in before if eligible(a)]
          if len(targets) > 35:
              raise SystemExit("Unexpected target count; cleanup aborted")
          print("EA001_ELIGIBLE", len(targets))
          for a in targets:
              req = urllib.request.Request(base + f"actions/artifacts/{a['id']}", headers=headers, method="DELETE")
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit("Unexpected deletion status")
              print("EA001_DELETED_ARTIFACT_ID", a["id"])
          after = list_all()
          remaining = sum(eligible(a) for a in after)
          retained = any(a["id"] == retained_id and not a["expired"] for a in after)
          print("EA001_DELETED", len(targets), "EA001_REMAINING_ELIGIBLE", remaining, "EA001_RETAINED_VERIFIED", retained)
          if remaining or not retained:
              raise SystemExit("Cleanup verification incomplete")
          PY
